<!doctype html><meta charset="utf-8">
<style>
 @font-face { font-family:'Inter'; src: url('file:///home/claude/aestheticsrippy/fonts/Inter-var.woff2'); }
 body { background:#f4f3f0; margin:24px; font-family:Inter; }
 .s { font-size:64px; font-weight:400; margin:10px 0; }
 .gain   { filter:url(#gain); }
 .xerox  { filter:url(#xerox); }
 .soft   { filter:url(#soft); }
 .wrap { position:relative; width:640px; height:110px; }
 .under { position:absolute; font-size:84px; font-weight:700; color:#2e2e2e; filter:url(#soft); }
 .over  { position:absolute; left:120px; top:28px; font-size:46px; font-style:italic; color:#d40f14;
          mix-blend-mode:multiply; filter:url(#gain); }
</style>
<svg width="0" height="0"><defs>
 <filter id="gain"><feMorphology operator="dilate" radius="1.3"/><feGaussianBlur stdDeviation="0.9"/>
   <feComponentTransfer><feFuncA type="gamma" amplitude="1" exponent="0.6" offset="0"/></feComponentTransfer></filter>
 <filter id="soft"><feMorphology operator="dilate" radius="1.8"/><feGaussianBlur stdDeviation="2.2"/>
   <feComponentTransfer><feFuncA type="gamma" amplitude="1" exponent="0.55" offset="0"/></feComponentTransfer></filter>
 <filter id="xerox"><feMorphology operator="dilate" radius="1.2" result="fat"/>
   <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="7" result="n"/>
   <feDisplacementMap in="fat" in2="n" scale="4"/>
   <feGaussianBlur stdDeviation="0.9"/>
   <feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0.25 0.8 1"/></feComponentTransfer></filter>
</defs></svg>
<div class="s">Wireless Environment (plain)</div>
<div class="s gain">Wireless Environment (ink gain)</div>
<div class="s xerox">Wireless Environment (photocopy)</div>
<div class="wrap"><div class="under">Office</div><div class="over">office</div></div>
