<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buum Films | Production Slip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Inter+Tight:wght@800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page-sheet" id="buum-sheet">
    
    <!-- 4 Corner Registration Marks -->
    <div class="bm-corner-mark bm-mark-tl"></div>
    <div class="bm-corner-mark bm-mark-tr"></div>
    <div class="bm-corner-mark bm-mark-bl"></div>
    <div class="bm-corner-mark bm-mark-br"></div>

    <!-- Top Metadata -->
    <header class="bm-top-meta">
      <div class="bm-meta-row-1">
        <span data-field="companyName">BUUM FILMS</span>
        <span data-field="phone">+34.676.12.61.50</span>
        <span data-field="website">WWW.BUUMFILMS.COM</span>
      </div>
      <div class="bm-meta-row-2">
        <span>BRING</span>
        <span>YOUR</span>
        <span>SHIT</span>
        <span>TO</span>
        <span>THE</span>
        <span>WORLD</span>
      </div>
      <div class="bm-tick-row">
        <span>_|_</span>
        <span>_|_</span>
      </div>
    </header>

    <!-- Center Hero Script with Framing Brackets -->
    <section class="bm-center-hero">
      <div class="bm-center-brackets">
        <div class="bm-bracket-tl"></div>
        <div class="bm-bracket-tr"></div>
        <div class="bm-bracket-bl"></div>
        <div class="bm-bracket-br"></div>

        <!-- Authentic thick energetic brush signature -->
        <svg class="bm-script-svg" viewBox="0 0 240 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 52 C 24 22, 38 12, 54 18 C 66 22, 60 48, 52 52 C 45 55, 36 50, 48 38 C 60 26, 75 32, 85 45 C 92 54, 102 36, 114 42 C 124 47, 132 38, 145 42 C 158 46, 168 34, 185 44 C 196 50, 215 54, 232 50" stroke="#050505" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M38 15 C 44 28, 48 45, 50 56" stroke="#050505" stroke-width="6" stroke-linecap="round"/>
        </svg>

        <div class="bm-script-sub" data-field="heroSub">FILMS</div>
      </div>
    </section>

    <!-- Lower Section -->
    <section class="bm-bottom-section">
      <!-- Lower Monospace Meta -->
      <div class="bm-lower-meta">
        <div class="bm-meta-row-2">
          <span>BRING</span>
          <span>YOUR</span>
          <span>SHIT</span>
          <span>TO</span>
          <span>THE</span>
          <span>WORLD</span>
        </div>
        <div class="bm-meta-row-1" style="margin-top: 2px;">
          <span>BUUM FILMS</span>
          <span>+34.676.12.61.50</span>
          <span>WWW.BUUMFILMS.COM</span>
        </div>
      </div>

      <!-- Giant Footer Typography -->
      <footer class="bm-footer-type">
        <div class="bm-footer-line">
          <span>PRODUCTION</span>
        </div>
        <div class="bm-footer-line">
          <span>COMPANY</span>
          <span class="bm-copyright-circle">&copy;</span>
        </div>
      </footer>
    </section>

  </main>

</body>
</html>
