<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifesto Red | Swiss Editorial Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Inter+Tight:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page-sheet" id="poster-sheet">
    
    <!-- Top Block with Headline Stack and Inset Photo -->
    <div class="mr-top-container">
      
      <!-- Asymmetrical Inset Photo Window -->
      <div class="mr-photo-inset">
        <img class="mr-photo-img" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop" alt="Editorial Cutout">
      </div>

      <!-- Giant Stacked Headline -->
      <div class="mr-headline-wrap">
        <div class="mr-headline-line" data-field="headline.0">LOCAL</div>
        <div class="mr-headline-line" data-field="headline.1">GLOBAL</div>
        <div class="mr-headline-line" data-field="headline.2">PERSONAL</div>
        <div class="mr-headline-line" data-field="headline.3">PUBLIC</div>
        <div class="mr-headline-line" data-field="headline.4">SELFISH</div>
        <div class="mr-headline-line" data-field="headline.5">SELFLESS</div>
      </div>

    </div>

    <!-- Mid Mark -->
    <div class="mr-middle-mark">
      <div class="mr-stamp-logo" data-field="badgeText">
        SAN FRANCISCO<br>
        DESIGN WEEK
      </div>
    </div>

    <!-- Bottom 3-Column Metadata -->
    <footer class="mr-meta-grid">
      <div class="mr-meta-col">
        <div class="mr-meta-title">POWER</div>
        <div>SAN FRANCISCO</div>
        <div>DESIGN WEEK</div>
        <div>2021 JUNE 7-13</div>
      </div>
      <div class="mr-meta-col">
        <div class="mr-meta-title">POWER</div>
        <div>SAN FRANCISCO</div>
        <div>DESIGN WEEK</div>
        <div>2021 JUNE 7-13</div>
      </div>
      <div class="mr-meta-col">
        <div class="mr-meta-title">POWER</div>
        <div>SAN FRANCISCO</div>
        <div>DESIGN WEEK</div>
        <div>2021 JUNE 7-13</div>
      </div>
    </footer>

  </main>

</body>
</html>
