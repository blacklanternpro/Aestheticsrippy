<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Barlow+Condensed:wght@700;800;900&family=Archivo+Narrow:wght@600;700&family=Archivo+Black&family=Syne:wght@700;800;900&family=Montserrat:wght@800;900&family=Inter:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Playfair+Display+SC:wght@900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page-sheet">
  <!-- Top Header Navigation -->
  <header class="top-header visual-object ac-movable">
    <div class="header-left typo-mono">CREATIVE STUDIO</div>
    <div class="header-right typo-mono">OBBY &amp; JAPPARI</div>
  </header>

  <!-- Optical Alignment Calibration Ruler -->
  <div class="ruler-container visual-object ac-movable">
    <svg class="ruler-svg" viewBox="0 0 500 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="12" x2="500" y2="12" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- Ticks -->
      <path d="M10 2V22 M25 6V18 M40 6V18 M55 6V18 M70 6V18 M85 2V22 M100 6V18 M115 6V18 M130 6V18 M145 6V18 M160 2V22 M175 6V18 M190 6V18 M205 6V18 M220 6V18 M235 2V22 M265 2V22 M280 6V18 M295 6V18 M310 6V18 M325 6V18 M340 2V22 M355 6V18 M370 6V18 M385 6V18 M400 6V18 M415 2V22 M430 6V18 M445 6V18 M460 6V18 M475 6V18 M490 2V22" stroke="#1a1a1a" stroke-width="1.2"/>
      <!-- Center Target Circle -->
      <circle cx="250" cy="12" r="7" fill="#eae8e3" stroke="#1a1a1a" stroke-width="1.5"/>
      <circle cx="250" cy="12" r="3" fill="#1a1a1a"/>
    </svg>
  </div>

  <!-- Main Canvas Test Field -->
  <section class="test-field">
    <!-- Center Axis Vertical Alignment Line -->
    <div class="vertical-axis top-axis visual-object ac-movable">
      <div class="axis-dot"></div>
      <div class="axis-line"></div>
    </div>

    <!-- Reticle Calibration Dots -->
    <div class="reticle-dot dot-top-left visual-object ac-movable"></div>
    <div class="reticle-dot dot-top-right visual-object ac-movable"></div>
    <div class="reticle-dot dot-mid-left visual-object ac-movable"></div>
    <div class="reticle-dot dot-mid-right visual-object ac-movable"></div>
    <div class="reticle-dot dot-bottom-center visual-object ac-movable"></div>

    <!-- Upper Code Numbers -->
    <div class="code-num code-top-left typo-mono visual-object ac-movable">22</div>
    <div class="code-num code-top-right typo-mono visual-object ac-movable">22</div>

    <!-- Inset Studio Labels -->
    <div class="label-inset label-upper-left typo-mono visual-object ac-movable">CREATIVE STUDIO</div>

    <!-- Main Hero Typography Block -->
    <div class="hero-typography-container visual-object ac-movable">
      <h1 class="hero-title typo-grotesk">Office</h1>
      
      <!-- Overprinted Red Lens Badge -->
      <div class="red-stamp-overlay visual-object ac-movable">
        <svg class="stamp-svg" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="40" rx="92" ry="34" fill="none" stroke="#d9251d" stroke-width="4.5"/>
          <line x1="8" y1="40" x2="192" y2="40" stroke="#d9251d" stroke-width="1.5"/>
          <line x1="18" y1="26" x2="182" y2="26" stroke="#d9251d" stroke-width="1.2"/>
          <line x1="18" y1="54" x2="182" y2="54" stroke="#d9251d" stroke-width="1.2"/>
          <text x="100" y="47" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="24" fill="#d9251d" text-anchor="middle" letter-spacing="2">OFFICE</text>
        </svg>
      </div>
    </div>

    <!-- Lower Inset Studio Label -->
    <div class="label-inset label-lower-right typo-mono visual-object ac-movable">CREATIVE STUDIO</div>

    <!-- Lower Axis Line -->
    <div class="vertical-axis bottom-axis visual-object ac-movable">
      <div class="axis-line"></div>
      <div class="axis-dot"></div>
    </div>

    <!-- Circled Bottom Code Numbers -->
    <div class="code-circle code-circle-left typo-mono visual-object ac-movable">
      <span>22</span>
    </div>
    <div class="code-circle code-circle-right typo-mono visual-object ac-movable">
      <span>22</span>
    </div>
  </section>

  <!-- Bottom Header Navigation -->
  <footer class="bottom-header visual-object ac-movable">
    <div class="header-left typo-mono">CREATIVE STUDIO</div>
    <div class="header-right typo-mono">OBBY &amp; JAPPARI</div>
  </footer>
</main>
</body>
</html>
