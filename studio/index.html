<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aestheticsrippy</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="studio.css">
<script src="js/hyph-en-gb.js"></script>
<script src="js/rip-renderer.js"></script>
</head>
<body data-pane="sheet">
  <header class="topbar">
    <div class="wordmark" aria-label="Aestheticsrippy">Aestheticsrippy</div>
    <div class="doc-switch">
      <button id="doc-button" class="doc-button" type="button" aria-haspopup="menu" aria-controls="doc-menu">
        <span id="doc-name">No document</span>
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <div id="doc-menu" class="menu" role="menu" hidden></div>
    </div>
    <div class="history">
      <button id="undo" class="icon-button" type="button" aria-label="Undo" disabled></button>
      <button id="redo" class="icon-button" type="button" aria-label="Redo" disabled></button>
    </div>
    <div class="topbar-actions">
      <button id="save-file" class="button" type="button" hidden>Save to file</button>
      <button id="export" class="button primary" type="button" disabled>Export PDF</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="pane pane-content" aria-label="Content">
      <div id="content-panel" class="pane-scroll"></div>
    </aside>

    <section class="pane pane-sheet" aria-label="Sheet">
      <div id="sheet-area" class="sheet-area"></div>
      <footer class="sheet-footer">
        <p id="fit-status" class="fit-status" role="status" aria-live="polite"></p>
        <div class="zoom" role="group" aria-label="Zoom">
          <button id="zoom-out" class="icon-button small" type="button" aria-label="Zoom out">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <span id="zoom-value" class="zoom-value">100%</span>
          <button id="zoom-in" class="icon-button small" type="button" aria-label="Zoom in">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button id="zoom-fit" class="text-button" type="button">Fit</button>
          <button id="zoom-actual" class="text-button" type="button">Actual size</button>
        </div>
      </footer>
    </section>

    <aside class="pane pane-style" aria-label="Style">
      <div id="inspector" class="pane-scroll"></div>
    </aside>
  </main>

  <nav class="pane-tabs" role="tablist" aria-label="Panels">
    <button type="button" role="tab" data-pane-tab="content" aria-selected="false">Content</button>
    <button type="button" role="tab" data-pane-tab="sheet" aria-selected="true">Sheet</button>
    <button type="button" role="tab" data-pane-tab="style" aria-selected="false">Style</button>
  </nav>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
